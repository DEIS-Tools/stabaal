name: Format/lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: format
      run: make dry-format


  linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: linting
      run: make lint
